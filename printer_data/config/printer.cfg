[gcode_macro PRINT_START]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(80)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(180)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  M118 "Heating HE"
  M104 S175
  M118 "Set Bed & Wait"
  M190 S{BED_TEMP}
  M118 "Wait HE"
  M109 # S175
  M118 "Wait Chamber If needed"
  #TEMPERATURE_WAIT SENSOR="heater_generic chamber_fans" MINIMUM=chambertemp-15
  {% if CHAMBER_TEMP > 0 %}
    M118 "Waiting chamber"
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP}
    M118 Chamber Ready Print Start
    {% endif %}
    G28 XY
  G28 Z METHOD=CONTACT CALIBRATE=1
  G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z10 F7200
  CLEAN_NOZZLE
  BED_MESH_CLEAR
  QUAD_GANTRY_LEVEL
  G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z10 F7200
  CLEAN_NOZZLE
  G28 Z METHOD=CONTACT CALIBRATE=1
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=25
  BED_MESH_CALIBRATE ADAPTIVE=1
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5
  G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z10 F7200
  M109 S{EXTRUDER_TEMP}
  M190 S{BED_TEMP}
  PRIME_NOZZLE

  
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    
