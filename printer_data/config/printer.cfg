# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section
[include config_backup.cfg]
[include nevermore.cfg]
[include K-ShakeTune/*.cfg]
[include mainsail.cfg]
[include stealthburner_leds.cfg]
[include timelapse.cfg]
[include homing.cfg]
[include nitehawk-36.cfg]
#[include autotune.cfg]
[gcode]

[mcu]
##....................................................................
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------

serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_38002F001750535556323420-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 5000             #Max 4500
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0


#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
#endstop_pin: EBBCan: PB6
position_min: 0
##--------------------------------------------------------------------
##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 50   #Max 100 was 35
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver
[tmc2240 stepper_x]
cs_pin: PC4
interpolate: true
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disabled

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
##--------------------------------------------------------------------
##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 50  #Max 100 was 35
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver
[tmc2240 stepper_y]
cs_pin: PD11
interpolate: true
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disabled
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
#endstop_pin: probe:z_virtual_endstop
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
##--------------------------------------------------------------------
##  Uncomment below for 350mm build
position_max: 310

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

##  Make sure to update below for your relevant driver
[tmc2240 stepper_z]
cs_pin: PC6
interpolate: false
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disable

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z1]
cs_pin: PC7
interpolate: false
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disable

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z2]
cs_pin: PF2
interpolate: false
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disable

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z3]
cs_pin: PE4
interpolate: false
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disable


#####################################################################
#   Extruder
#####################################################################

[extruder]

rotation_distance: 20.5386250899375 #Bondtech 5mm Drive Gears
gear_ratio: 50:10               #BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75

##for rapido Extruder MAX31865 PT1000
sensor_type: PT1000
pullup_resistor:2200
min_temp: 0
max_temp: 300
max_power: 1.0
min_extrude_temp: 170 
max_extrude_only_distance: 200 
max_extrude_cross_section: 5
control = pid
pid_kp = 26.213
pid_ki = 1.304
pid_kd = 131.721 
##  Make sure to update below for your relevant driver (2208 or 2209)

## EXTRUDER MOTOR
[tmc2209 extruder]
stealthchop_threshold: 0
run_current: 0.30

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
##  Uncomment the following line if using the default SSR wiring from the docs site
heater_pin: PA3
##  Other wiring guides may use BED_OUT to control the SSR. Uncomment the following line for those cases
#heater_pin: PA1
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.6
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

#####################################################################
#   Probe
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_A64AB2295154364134202020FF141908-if00
x_offset: -0                # update with offset from nozzle on your machine
y_offset: 21.953            # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2

[resonance_tester]
accel_chip: beacon
probe_points: 175, 175, 20
accel_per_hz: 175
hz_per_sec: 0.5 


[force_move]
enable_force_move: True #   Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION

#####################################################################
#   Input Shaper
#####################################################################

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 55.4 
damping_ratio_x: 0.049
shaper_type_y: mzv
shaper_freq_y: 39.2
damping_ratio_y: 0.093

#####################################################################
#   Fan Control
#####################################################################


## Create a multi pin named "controllerFanMultiPin" consisting of 2+ pins
[multi_pin controllerFanMultiPin]
pins: PD12, PD13

##  Controller fan using the multipin above
[controller_fan Skirt_fans]
pin: multi_pin:controllerFanMultiPin
kick_start_time: 0.5
heater: heater_bed 



#####################################################################
#    Smart filament system v2
#####################################################################

[filament_switch_sensor switch_sensor]
switch_pin: ^PG12
pause_on_runout: False
runout_gcode:
    PAUSE # [pause_resume] is required in printer.cfg
    M117 Filament switch runout
    insert_gcode:
    M117 Filament switch inserted
    
[filament_motion_sensor encoder_sensor]
switch_pin: ^PG11
detection_length: 3.88
extruder: extruder
pause_on_runout: False
runout_gcode:
    PAUSE # [pause_resume] is required in printer.cfg
    M117 Filament encoder runout
insert_gcode:
    M117 Filament encoder inserted
    
    
    
#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################
    
[idle_timeout]
timeout: 1800  #43200

[quad_gantry_level]

#--------------------------------------------------------------------
##  Gantry Corners for 350mm Build
##  Uncomment for 350mm build
gantry_corners:
    -60,-10
    410,420
    ##Probe points
points:
    50,25
    50,275
    300,275
    300,25
    
#--------------------------------------------------------------------
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#--------------------------------------------------------------------

####################################################################
#  Bed Mesh
####################################################################
[bed_mesh]
speed: 600
horizontal_move_z: 10
##--------------------------------------------------------------------
mesh_min: 40, 40
mesh_max: 310,310
##--------------------------------------------------------------------
probe_count: 40, 40
algorithm: bicubic
zero_reference_position: 175, 175
    
#--------------------------------------------------------------------
#####################################################################
#   Temperature Sensors
#####################################################################
[temperature_sensor RPI_4B]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 100

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF4

#[temperature_sensor BTT_pad7_temp]
#sensor_type: temperature_host
#min_temp: 0
#max_temp: 100

#####################################################################
# Orca Slicer Support
#####################################################################
[exclude_object]

[gcode_arcs]
resolution: 0.1
#####################################################################
#  NiteHawk - 36
#####################################################################

[include nitehawk-36.cfg]

#####################################################################
#   Macros
#####################################################################
[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30
    
[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32
    
[gcode_macro PRIME_NOZZLE]
gcode:
    SAVE_GCODE_STATE NAME=PRIME_NOZZLE_STATE
    M117 Priming
    G90                        ; Absolute coordinates.
    M83                        ; Relative extruder mode.
    G92 E0                     ; Move to start of line.
    G1 Z10 F900
    G1 Y3 X3 F18000
    G1 Z0.4 F900               ; Print the line.
    G91                        ; Relative coordinates
    G1 X100 E30 F1000          ; Extrude filament 25mm
    G1 Y-2 F1000               ;(how much it retracted in PRINT_END).
    G1 X-60 E10 F1000           ; Print second part of the line.
    G1 E-0.5 F3000             ; Retract to avoid stringing.
    G1 X0.5 E0 F1000           ; Wipe back to to break string.
    G1 X-5.5 E0 F1000          ; Wipe forward to break stringing.
    RESTORE_GCODE_STATE NAME=PRIME_NOZZLE_STATE
    
[gcode_macro CLEAN_NOZZLE]  # nozzle wipe
gcode:
variable_start_x: 280.00
variable_start_y: 346.00
variable_start_z: 7
variable_wipe_dist: -74
variable_wipe_qty: 5
variable_wipe_spd: 200

gcode:
    STATUS_CLEANING
    {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
    {% endif %}
    
    G90                                            ; absolute positioning
    ## Move nozzle to start position
    G1 X{start_x} Y{start_y} Z{start_z} F{wipe_spd * 100}
    
    ## Wipe nozzle
    {% for wipes in range(1, (wipe_qty + 1)) %}
    G1 X{start_x + wipe_dist} F{wipe_spd * 100}
    G1 X{start_x} F{wipe_spd * 100}
    {% endfor %}
    
    
    #..................................................................
[gcode_macro PRINT_START]
gcode:
    
    {% set BED_TEMP = params.BED_TEMP|default(80)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(180)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
    
    # Initially start heating printer up
    M190 S{BED_TEMP}
    M109 S150
    CLEAN_NOZZLE
    
    # Home printer
    STATUS_HOMING
    G28 Z
    
    
    # OPTIONAL wait for enclosure to heat up
    # M117 Chamber wait..
    # STATUS_BUSY
    # TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP} # Uncomment to wait for chamber to heat up
    
    # Perform quad gantry level
    STATUS_LEVELING
    M117 QGL..
    QUAD_GANTRY_LEVEL
    
    
    # Re-home Z and load bed mesh (name: Default)
    M117 Z Calibration..
    STATUS_CALIBRATING_Z
    G28 Z
    BED_MESH_CALIBRATE ADAPTIVE=1
    
    # Wait for bed to heat up
    STATUS_HEATING
    M117 Heating Bed..
    M190 S{BED_TEMP}
    CLEAN_NOZZLE
    
    # Final extruder heat up
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z10 F7200
    STATUS_HEATING
    M117 Heating Hot End..
    M109 S{EXTRUDER_TEMP}
    
    # nozzle wipe
    CLEAN_NOZZLE
    
    #purge line
    Purge line
    PRIME_NOZZLE
    STATUS_READY
    M117 Printing..
    
    
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    
