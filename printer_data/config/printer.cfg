[include mainsail.cfg]
[include nevermore.cfg]
[include K-ShakeTune/*.cfg]
[include stealthburner_leds.cfg]
[include timelapse.cfg]
[include nitehawk-36.cfg]
#[include autotune.cfg]
[gcode]

[mcu]
##....................................................................
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------

serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_38002F001750535556323420-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 5000             #Max 4500
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0


#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
#endstop_pin: EBBCan: PB6
position_min: 0
##--------------------------------------------------------------------
##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 150   #Max 100 was 35
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver
[tmc2240 stepper_x]
cs_pin: PC4
interpolate: true
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disabled

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
##--------------------------------------------------------------------
##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 150  #Max 100 was 35
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver
[tmc2240 stepper_y]
cs_pin: PD11
interpolate: true
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disabled
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
##--------------------------------------------------------------------
##  Uncomment below for 350mm build
position_max: 310

##--------------------------------------------------------------------
position_min: -5
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 0

##  Make sure to update below for your relevant driver
[tmc2240 stepper_z]
cs_pin: PC6
interpolate: false
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disable

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z1]
cs_pin: PC7
interpolate: false
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disable

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z2]
cs_pin: PF2
interpolate: false
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disable

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z3]
cs_pin: PE4
interpolate: false
run_current: 0.8
spi_bus: spi1
rref: 12000
spi_speed: 500000
stealthchop_threshold: 0	#It is recommended to keep stealthchop disable


#####################################################################
#   Extruder
#####################################################################

[extruder]

rotation_distance: 22.853888281894 #Bondtech 5mm Drive Gears 
gear_ratio: 50:10               #BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75

##for rapido Extruder MAX31865 PT1000
sensor_type: PT1000
pullup_resistor:2200
min_temp: 0
max_temp: 300
max_power: 1.0
min_extrude_temp: 0 #170 
max_extrude_only_distance: 101 #200 
max_extrude_cross_section: 5
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721 
##  Make sure to update below for your relevant driver (2208 or 2209)

## EXTRUDER MOTOR
[tmc2209 extruder]
stealthchop_threshold: 0
run_current: 0.30

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.6
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Probe
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_A64AB2295154364134202020FF141908-if00
x_offset: 0                # update with offset from nozzle on your machine
y_offset: 21.953            # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed
contact_max_hotend_temperature: 180
home_xy_position: 175, 175
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
autocal_tolerance: 0.008

[resonance_tester]
accel_chip: beacon
probe_points: 175, 175, 20
accel_per_hz: 175
hz_per_sec: 0.5 


[force_move]
enable_force_move: True #   Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION

#####################################################################
#   Input Shaper
#####################################################################

[input_shaper]
shaper_type_x: ei
shaper_freq_x: 72.6
damping_ratio_x: 0.062
shaper_type_y: ei
shaper_freq_y: 50.02
damping_ratio_y: 0.055

#####################################################################
#   tmc autotune
#####################################################################

[autotune_tmc stepper_x]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_y]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_z]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_z1]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_z2]
motor: moons-ms17hd6p420i
[autotune_tmc stepper_z3]
motor: moons-ms17hd6p420i

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg

#####################################################################
#    Shake n Tune
#####################################################################

[shaketune]
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 200
dpi: 300

#####################################################################
#   Fan Control
#####################################################################


## Create a multi pin named "controllerFanMultiPin" consisting of 2+ pins
[multi_pin controllerFanMultiPin]
pins: PD12, PD13

##  Controller fan using the multipin above
[controller_fan Skirt_fans]
pin: multi_pin:controllerFanMultiPin
kick_start_time: 0.5
heater: heater_bed 



#####################################################################
#    Smart filament system v2
#####################################################################

[filament_switch_sensor switch_sensor]
switch_pin: ^PG12
pause_on_runout: False
runout_gcode:
    PAUSE # [pause_resume] is required in printer.cfg
    M117 Filament switch runout
    insert_gcode:
    M117 Filament switch inserted
    
[filament_motion_sensor encoder_sensor]
switch_pin: ^PG11
detection_length: 3.88
extruder: extruder
pause_on_runout: False
runout_gcode:
    PAUSE # [pause_resume] is required in printer.cfg
    M117 Filament encoder runout
insert_gcode:
    M117 Filament encoder inserted
    
    
    
#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################
    
[idle_timeout]
timeout: 1800  #43200

[quad_gantry_level]

#--------------------------------------------------------------------
##  Gantry Corners for 350mm Build
##  Uncomment for 350mm build
gantry_corners:
    -60,-10
    410,420
    ##Probe points
points:
    50,25
    50,275
    300,275
    300,25
    
#--------------------------------------------------------------------
speed: 800
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#--------------------------------------------------------------------

####################################################################
#  Bed Mesh
####################################################################
[bed_mesh]
speed: 1000
horizontal_move_z: 10
##--------------------------------------------------------------------
mesh_min: 40, 40
mesh_max: 310,310
##--------------------------------------------------------------------
probe_count: 40, 40
algorithm: bicubic
zero_reference_position: 175, 175
    
#--------------------------------------------------------------------
#####################################################################
#   Temperature Sensors
#####################################################################
[temperature_sensor RPI_4B]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 100

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF4


#[temperature_sensor BTT_pad7_temp]
#sensor_type: temperature_host
#min_temp: 0
#max_temp: 100

#####################################################################
# Orca Slicer Support
#####################################################################
[exclude_object]

[gcode_arcs]
resolution: 0.1
#####################################################################
#  NiteHawk - 36
#####################################################################

[include nitehawk-36.cfg]

#####################################################################
#   Macros
#####################################################################
[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30
    
[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32
    
[gcode_macro PRIME_NOZZLE]
gcode:
    SAVE_GCODE_STATE NAME=PRIME_NOZZLE_STATE
    M117 Priming
    G90                        ; Absolute coordinates.
    M83                        ; Relative extruder mode.
    G92 E0                     ; Move to start of line.
    G1 Z10 F900
    G1 Y3 X3 F18000
    G1 Z0.4 F900               ; Print the line.
    G91                        ; Relative coordinates
    G1 X100 E30 F1000          ; Extrude filament 25mm
    G1 Y-2 F1000               ;(how much it retracted in PRINT_END).
    G1 X-60 E10 F1000           ; Print second part of the line.
    G1 E-0.5 F3000             ; Retract to avoid stringing.
    G1 X0.5 E0 F1000           ; Wipe back to to break string.
    G1 X-5.5 E0 F1000          ; Wipe forward to break stringing.
    RESTORE_GCODE_STATE NAME=PRIME_NOZZLE_STATE
    
[gcode_macro CLEAN_NOZZLE]  # nozzle wipe
gcode:
variable_start_x: 280.00
variable_start_y: 350.00
variable_start_z: 7
variable_wipe_dist: -74
variable_wipe_qty: 5
variable_wipe_spd: 400

gcode:
    STATUS_CLEANING
    {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
    {% endif %}
    
    G90                                            ; absolute positioning
    ## Move nozzle to start position
    G1 X{start_x} Y{start_y} Z{start_z} F{wipe_spd * 300}
    
    ## Wipe nozzle
    {% for wipes in range(1, (wipe_qty + 1)) %}
    G1 X{start_x + wipe_dist} F{wipe_spd * 300}
    G1 X{start_x} F{wipe_spd * 300}
    {% endfor %}
    
    
    #..................................................................
