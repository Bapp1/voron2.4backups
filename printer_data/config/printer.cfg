gantry_corners:
   -60,-10
   410,420
##Probe points
points:
   50,25
   50,275
   300,275
   300,25

#--------------------------------------------------------------------
speed: 4000 #speed 300
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0055
