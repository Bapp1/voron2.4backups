[gcode_macro _HOME_X]
gcode:
    # Always use consistent run_current on A/B steppers during sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.5 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    SAVE_GCODE_STATE NAME=_HOME_X

    # Home
    G28 X
    # Move away
    G91
    G1 X-10 F3600
    
    # Make sure StallGuard registers are cleared
    M400
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

    G90
    RESTORE_GCODE_STATE NAME=_HOME_X

[gcode_macro _HOME_Y]
gcode:
    # Set current for sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.5 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    SAVE_GCODE_STATE NAME=_HOME_Y

    # Home
    G28 Y
    # Move away
    G91
    G1 Y-10 F3600

    # Make sure StallGuard registers are cleared
    M400
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

    G90
    RESTORE_GCODE_STATE NAME=_HOME_Y


[gcode_macro _HOME_Z]
variable_z_calibrated: False
gcode:
    {% set skip_model_creation=params.SKIP_MODEL_CREATION|default(0)|int %}

    SAVE_GCODE_STATE NAME=_HOME_Z

    G90
    G1 X175 Y175 F15000

    BEACON_AUTO_CALIBRATE {% if skip_model_creation %}SKIP_MODEL_CREATION=1{% endif %}
    G1 Z10 F1500
    G1 X175 Y175 F15000 ; move back to center after model creation moved the toolhead

    RESTORE_GCODE_STATE NAME=_HOME_Z
    {% if not skip_model_creation %}
      SET_GCODE_VARIABLE MACRO=_HOME_Z VARIABLE=z_calibrated VALUE=True
    {% endif %}


[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set need_z_hop = False %}
  {% set calibrate_z = not printer['gcode_macro _HOME_Z'].z_calibrated %}
  
  {% if 'z' in printer.toolhead.homed_axes %}
    {% set need_z_hop = printer.toolhead.position.z < 3 %}
  {% else %}
    {% set calibrate_z = True %} # previous calibration, if it exists, needs to be redone
    
    # Enable Z hop
    SET_KINEMATIC_POSITION Z=0 # after this, Z is considered a homed axis
    {% set need_z_hop = True %}
  {% endif %}

  # Z-hop before homing
  {% if need_z_hop %}
    SAVE_GCODE_STATE NAME=homing_override
    G90
    G0 Z3 F1200
    RESTORE_GCODE_STATE NAME=homing_override
  {% endif %}

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}

  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}

  {% if home_all or 'Z' in params %}
    _HOME_Z SKIP_MODEL_CREATION={ 0 if calibrate_z else 1 }
  {% endif %}


[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
